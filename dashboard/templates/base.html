<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Awan - Secure Cloud AI Storage{% endblock %}</title>
    
    <!-- 🎨 Google Fonts (Modern Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- 🚀 Frameworks & Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }
        .sidebar-item:hover { @apply bg-blue-50 text-blue-600; }
        .sidebar-item.active { @apply bg-blue-600 text-white shadow-lg shadow-blue-200; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-900 antialiased overflow-x-hidden">
    
    <!-- Toast Messages (Global Notification System) -->
    {% if messages %}
    <div class="fixed top-6 right-6 z-[9999] space-y-3 pointer-events-none" x-data="{ show: true }" x-init="setTimeout(() => show = false, 5000)">
        {% for message in messages %}
        <div x-show="show" x-transition.duration.500ms
             class="p-4 rounded-2xl shadow-2xl flex items-center gap-4 border pointer-events-auto
                    {% if message.tags == 'success' %}bg-emerald-50 border-emerald-100 text-emerald-800
                    {% elif message.tags == 'error' %}bg-red-50 border-red-100 text-red-800
                    {% else %}bg-white border-slate-200 text-slate-800{% endif %}">
            <i data-lucide="{% if message.tags == 'success' %}check-circle-2{% elif message.tags == 'error' %}alert-circle{% else %}info{% endif %}" class="w-5 h-5"></i>
            <p class="text-sm font-bold">{{ message }}</p>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Main Content Layout -->
    <div class="flex h-screen overflow-hidden">
        {% block content %}{% endblock %}
    </div>

    <!-- 🖌️ Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
