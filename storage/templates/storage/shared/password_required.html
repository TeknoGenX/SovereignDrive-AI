<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Password Diperlukan - Awan</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; }
        .error { color: red; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="card">
        <h3>🔒 Terproteksi</h3>
        <p>File/Folder ini memerlukan password untuk diakses.</p>
        <form method="POST">
            {% csrf_token %}
            <input type="password" name="password" placeholder="Masukkan password..." required autofocus>
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <button type="submit">Buka Akses</button>
        </form>
    </div>
</body>
</html>
