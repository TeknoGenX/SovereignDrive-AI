<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{{ file.name }} - Awan Shared</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f7f6; margin: 0; }
        .container { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 450px; text-align: center; }
        .file-icon { font-size: 4.5rem; color: #007bff; margin-bottom: 1.5rem; }
        .file-name { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; word-break: break-all; }
        .file-meta { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
        .btn-download { background: #28a745; color: white; text-decoration: none; padding: 12px 30px; border-radius: 6px; font-weight: 600; display: inline-block; transition: 0.2s; }
        .btn-download:hover { background: #218838; }
        .footer { margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem; font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="file-icon">📄</div>
        <div class="file-name">{{ file.name }}</div>
        <div class="file-meta">Dibagikan oleh {{ shared_link.creator.username }}</div>
        
        <a href="?download=1" class="btn-download">⬇️ Download Sekarang</a>

        <div class="footer">
            Dikelola dengan Aplikasi Awan ☁️
        </div>
    </div>
</body>
</html>
