<!-- Enterprise Sidebar -->
<aside class="bg-white border-r flex-shrink-0 flex flex-col transition-all duration-300 shadow-sm z-50 h-full overflow-hidden" 
       :class="sidebarOpen ? 'w-64' : 'w-0 overflow-hidden'">
    
    <div class="p-6">
        <a href="{% url 'storage:dashboard' %}" class="flex items-center gap-3 px-2 mb-8">
            <div class="bg-blue-600 w-8 h-8 rounded-lg flex items-center justify-center shadow-lg shadow-blue-200">
                <i data-lucide="cloud" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tight text-slate-900">AWAN</span>
        </a>

        <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-blue-100 transition-all active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i> Baru
            </button>
            
            <div x-show="open" x-cloak @click.away="open = false" 
                 class="absolute left-0 right-0 mt-2 bg-white border border-slate-100 rounded-xl shadow-2xl z-50 py-2 overflow-hidden animate-in fade-in zoom-in duration-200">
                <a href="{% url 'storage:upload_file' %}" class="flex items-center gap-3 px-4 py-3 text-sm text-slate-700 hover:bg-blue-50 transition-colors">
                    <i data-lucide="file-up" class="w-4 h-4 text-blue-500"></i> Unggah File
                </a>
                <button @click="folderModalOpen = true; open = false" class="w-full flex items-center gap-3 px-4 py-3 text-sm text-slate-700 hover:bg-emerald-50 transition-colors">
                    <i data-lucide="folder-plus" class="w-4 h-4 text-emerald-500"></i> Buat Folder
                </button>
            </div>
        </div>
    </div>
    
    <nav class="flex-grow px-4 overflow-y-auto space-y-6">
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-3 mb-3">Utama</p>
            <div class="space-y-1">
                <a href="{% url 'storage:dashboard' %}" class="flex items-center gap-3 px-3 py-2.5 text-sm font-bold rounded-xl transition-all {% if request.resolver_match.url_name == 'dashboard' %}bg-blue-600 text-white shadow-lg shadow-blue-100{% else %}text-slate-600 hover:bg-slate-50{% endif %}">
                    <i data-lucide="files" class="w-4 h-4"></i> Semua File
                </a>
                <a href="{% url 'storage:trash_bin' %}" class="flex items-center gap-3 px-3 py-2.5 text-sm font-bold rounded-xl transition-all {% if request.resolver_match.url_name == 'trash_bin' %}bg-red-50 text-red-600{% else %}text-slate-600 hover:bg-slate-50{% endif %}">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Tong Sampah
                </a>
            </div>
        </div>

        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-3 mb-3">Akun</p>
            <div class="space-y-1">
                <a href="{% url 'storage:profile' %}" class="flex items-center gap-3 px-3 py-2.5 text-sm font-bold rounded-xl transition-all {% if request.resolver_match.url_name == 'profile' %}bg-blue-600 text-white shadow-lg shadow-blue-100{% else %}text-slate-600 hover:bg-slate-50{% endif %}">
                    <i data-lucide="user" class="w-4 h-4"></i> Profil & Kuota
                </a>
            </div>
        </div>
    </nav>

    {% if profile %}
    <div class="p-6 border-t bg-slate-50/50">
        <div class="flex items-center justify-between mb-2">
            <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Kapasitas</span>
            <span class="text-[10px] font-extrabold text-slate-900">{{ used_gb }} GB / {{ limit_gb }} GB</span>
        </div>
        <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
            <div class="bg-blue-600 h-full transition-all duration-500" 
                 style="width: {{ storage_percent }}%"></div>
        </div>
    </div>
    {% endif %}
</aside>
